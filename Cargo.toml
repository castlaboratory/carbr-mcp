[package]
name = "carbr-mcp"
version = "0.4.0"
edition = "2021"
description = "Servidor MCP (HTTP) com as consultas ao Cadastro Ambiental Rural, lendo a publicação do carbr"
license = "MIT"
repository = "https://github.com/castlaboratory/carbr-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
duckdb = { version = "1.20001", features = ["bundled"] }
rmcp = { version = "3.11", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
